[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopsy"
version = "0.1.0"
description = "Your agent died. Here's why. — Zero-config observability & failure replay for agentic LLM apps"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["llm", "agents", "observability", "tracing", "debugging", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "google-generativeai>=0.7.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "filelock>=3.13.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.2.0", "langchain-openai>=0.1.0"]
autogen = ["pyautogen>=0.2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff"]

[project.scripts]
autopsy = "autopsy.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["autopsy", "autopsy.core", "autopsy.diagnostics",
           "autopsy.server", "autopsy.cli", "autopsy.deploy"]
exclude = ["autopsy.server.static*", "autopsy.server.routes*"]

[tool.setuptools.package-data]
"autopsy.server" = ["static/**/*", "_dashboard.html", "_dashboard_part1.js",
                    "_dashboard_part2.js", "_dashboard_part3.js"]
