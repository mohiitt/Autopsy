<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>autopsy — your agent died. here's why.</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0e14;
  --bg-2: #0f141b;
  --bg-3: #161c24;
  --border: #232b36;
  --text: #d9e1ec;
  --muted: #7b8896;
  --accent: #ff6b3d;
  --ok: #3ddc97;
  --err: #ff5d5d;
  --warn: #ffb84d;
  --running: #ffb84d;
  --blue: #6aa9ff;
}
html, body { height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif; }
button { font: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
header { display: flex; align-items: center; gap: 14px; padding: 12px 16px;
  border-bottom: 1px solid var(--border); background: var(--bg-2); }
.logo { font-weight: 700; font-size: 16px; letter-spacing: 0.4px; }
.logo .dot { color: var(--accent); }
.tag { color: var(--muted); font-style: italic; font-size: 12px; }
.spacer { flex: 1; }
.pill { padding: 3px 8px; border-radius: 999px; font-size: 11px; background: var(--bg-3);
  border: 1px solid var(--border); }
.pill.live::before { content: ""; display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: var(--ok); margin-right: 6px;
  box-shadow: 0 0 6px var(--ok); animation: pulse 1.4s infinite; }
.pill.dead::before { content: ""; display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: var(--err); margin-right: 6px; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

main { display: grid; grid-template-columns: 240px 1fr 380px;
  height: calc(100vh - 49px); }
.sidebar { background: var(--bg-2); border-right: 1px solid var(--border);
  overflow-y: auto; }
.sidebar h3 { padding: 14px 14px 6px; color: var(--muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
.session { padding: 10px 14px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.1s; }
.session:hover { background: var(--bg-3); }
.session.active { background: var(--bg-3); border-left: 3px solid var(--accent);
  padding-left: 11px; }
.session .name { font-weight: 600; margin-bottom: 3px; }
.session .meta { color: var(--muted); font-size: 11px; }
.session .status { display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; margin-right: 6px; }
.session .status.success { background: var(--ok); }
.session .status.error { background: var(--err); }
.session .status.unknown { background: var(--muted); }

.center { padding: 16px; overflow: auto; }
.center h2 { font-size: 14px; color: var(--muted); margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
.empty { color: var(--muted); padding: 60px 20px; text-align: center; }
.empty code { background: var(--bg-3); padding: 2px 8px; border-radius: 4px;
  color: var(--accent); font-size: 12px; }

.dag { position: relative; min-height: 200px; padding: 8px 4px; }
.dag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.node-card { background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; cursor: pointer;
  transition: all 0.15s; min-width: 170px; max-width: 240px; }
.node-card:hover { transform: translateY(-1px); border-color: var(--accent); }
.node-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.node-card.ok { border-left: 3px solid var(--ok); }
.node-card.error { border-left: 3px solid var(--err); animation: errpulse 2s infinite; }
.node-card.running { border-left: 3px solid var(--running); }
@keyframes errpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,93,93,0.0); }
  50% { box-shadow: 0 0 12px 1px rgba(255,93,93,0.4); } }
.node-name { font-weight: 600; font-size: 12px; margin-bottom: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; }
.node-meta .type { background: var(--bg); padding: 1px 6px; border-radius: 4px; }

.detail { background: var(--bg-2); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 16px; }
.detail h3 { font-size: 13px; margin-bottom: 6px; }
.detail .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
.tab-row { display: flex; gap: 4px; border-bottom: 1px solid var(--border);
  margin-bottom: 12px; }
.tab { padding: 6px 10px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; font-size: 12px; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px;
  font-size: 12px; margin-bottom: 12px; }
.kv .k { color: var(--muted); }
pre.code { background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px; overflow-x: auto; font-size: 11px;
  font-family: "SF Mono", Menlo, monospace; color: var(--text);
  white-space: pre-wrap; word-break: break-word; max-height: 320px;
  overflow-y: auto; }
pre.code.err { color: #ffd0d0; border-color: var(--err); }
.btn { background: var(--accent); color: #11151b; border: none; padding: 8px 14px;
  border-radius: 6px; font-weight: 600; font-size: 12px;
  display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { filter: brightness(1.1); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--text);
  border: 1px solid var(--border); }
.btn-row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }

.diag-card { background: linear-gradient(180deg,#1a2230,var(--bg-3));
  border: 1px solid var(--accent); border-radius: 8px; padding: 14px;
  margin-top: 10px; }
.diag-card h4 { color: var(--accent); margin-bottom: 8px; font-size: 13px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 10px; background: var(--bg); margin-right: 6px;
  border: 1px solid var(--border); }
.bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden;
  margin: 6px 0; }
.bar > div { height: 100%; background: var(--ok); transition: width 0.3s; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-3);
  border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px;
  font-size: 12px; max-width: 360px;
  box-shadow: 0 6px 30px rgba(0,0,0,0.5); }
.toast.err { border-color: var(--err); }
.summary-strip { display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px; margin-bottom: 16px; }
.stat { background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px; }
.stat .label { color: var(--muted); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.6px; }
.stat .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
.stat .value.err { color: var(--err); }
.stat .value.ok { color: var(--ok); }
.latency-bars { background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; }
.lb-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  font-size: 11px; }
.lb-row .lbar { flex: 1; height: 14px; background: var(--bg); border-radius: 3px;
  overflow: hidden; }
.lb-row .lbar > div { height: 100%; background: var(--accent); }
.lb-row .lname { width: 140px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-row .lval { width: 60px; text-align: right; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="logo">autopsy<span class="dot">.</span></div>
  <div class="tag">your agent died. here's why.</div>
  <div class="spacer"></div>
  <div id="ws-status" class="pill dead">offline</div>
</header>
<main>
  <aside class="sidebar">
    <h3>Traces</h3>
    <div id="session-list">
      <div class="empty">no traces yet.<br/><br/>
        run <code>autopsy run agent.py</code></div>
    </div>
  </aside>
  <section class="center" id="center">
    <div class="empty">Select a trace to inspect.</div>
  </section>
  <aside class="detail" id="detail">
    <div class="empty">Click a node to see details.</div>
  </aside>
</main>
<div id="toast-container"></div>
<script src="/_dashboard.js"></script>
</body>
</html>
